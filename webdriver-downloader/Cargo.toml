[package]
name = "webdriver-downloader"
version = "0.17.0"
edition = "2021"
authors = ["ik1ne <ik1ne@naver.com>"]
description = "Library for webdriver download."
repository = "https://github.com/ik1ne/webdriver-downloader"
homepage = "https://github.com/ik1ne/webdriver-downloader"
license = "MIT"
readme = "README.md"
keywords = ["webdriver-downloader", "webdriver", "chromedriver", "geckodriver"]
categories = ["web-programming"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
bytes = "1"
async-trait = "0.1"
fantoccini = { version = "0.22", default-features = false }
flate2 = "1.0"
home = "0.5"
lenient_semver = "0.4"
nix = { version = "0.31", features = ["user"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false }
regex = "1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["process", "time"] }
tracing = "0.1"
which = "8"
zip = "9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
test-log = { version = "0.2", features = ["trace"] }

[features]
default = ["native-tls"]
native-tls = ["fantoccini/native-tls", "reqwest/native-tls"]
rustls-tls = ["fantoccini/rustls-tls", "reqwest/rustls"]
